# Lasting test-budget enforcement (owner order 2026-10-31):
# no test over 20 s, max 3 mega-tests at 40 s.
#
# This file is the source of truth. The test scripts copy it to the
# classpath root ($OUT) before every run, so the whole suite - gate,
# domains, full - runs under the same kill budget without per-class
# annotations on 500+ files.
#
# Duration format: "<number> <unit>" (ms, s, m). Verified against the
# vendored JUnit 5.10: Constants DEFAULT_TIMEOUT_PROPERTY_NAME and
# DEFAULT_TIMEOUT_THREAD_MODE_PROPERTY_NAME.
junit.jupiter.execution.timeout.default = 20 s
# Mockito's static mocks (the whole harness: AGame, BaseSelect, Main) are
# thread-local: a mock registered in @BeforeEach is invisible inside a
# separate-thread worker, so every world/sim test NPEs there (proven:
# ScratchMockProbeTest - a registered AGame mock does not intercept in
# the worker, while an in-body mock works). SAME_THREAD still fails an
# over-budget test loudly, just after it finishes instead of preempting
# it; the audit script owns the wall-time verdict.
junit.jupiter.execution.timeout.thread.mode.default = same_thread

# Mega-tests (at most 3 classes tagged @Tag("mega-test")) carry their own
# @Timeout(40) annotation, which overrides this default. Nothing else may
# exceed 20 s: the run fails loudly instead of paralyzing the workflow.
